name: Build StudyLock APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk StudyLock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StudyLock-APK
          path: StudyLock.apk
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StudyLock.apk --title "StudyLock APK (latest)" --notes "Debug build of StudyLock. Download StudyLock.apk and install it on your Android phone."
